# Service account used by the GitHub Actions pipeline (.github/workflows/release.yml).
# Apply once as a project admin:  NAMESPACE=slipless envsubst < openshift/ci/serviceaccount.yaml | oc apply -n slipless -f -
# Token for the OPENSHIFT_TOKEN GitHub secret:
#   oc get secret github-actions-token -n slipless -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions
  labels:
    app.kubernetes.io/name: sliples
    app.kubernetes.io/component: ci
---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-token
  annotations:
    kubernetes.io/service-account.name: github-actions
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions
rules:
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs", "buildconfigs/instantiate", "builds", "builds/log"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags", "imagestreamimages"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions
