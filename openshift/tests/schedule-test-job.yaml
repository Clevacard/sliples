apiVersion: batch/v1
kind: Job
metadata:
  name: sliples-test-schedules
  namespace: sliples
  labels:
    app.kubernetes.io/name: sliples
    app.kubernetes.io/component: test
    test-suite: schedules
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600  # 10 minute timeout
  ttlSecondsAfterFinished: 3600  # Clean up after 1 hour
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sliples
        app.kubernetes.io/component: test
    spec:
      restartPolicy: Never
      containers:
        - name: test-runner
          image: sliples-backend:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - pytest
            - tests/test_schedule_execution.py
            - -v
            - --tb=short
            - --no-header
            - -q
          env:
            # Use the live database but a separate test schema/db
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sliples-db-credentials
                  key: DATABASE_URL_TEST
                  optional: true
            # Fallback: use main DB URL (tests use isolated transactions)
            - name: DATABASE_URL_FALLBACK
              valueFrom:
                secretKeyRef:
                  name: sliples-db-credentials
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379/1"  # Use DB 1 for test isolation
            - name: TESTING
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
